<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cruising — App öffnen</title>
    <meta http-equiv="refresh" content="0; url=https://play.google.com/store/apps/details?id=com.tomesschuch.cruising">
    <link rel="canonical" href="https://play.google.com/store/apps/details?id=com.tomesschuch.cruising">
    <link rel="icon" type="image/png" href="/assets/app-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/style.css">
    <script>
        // Sofortige Weiterleitung per JS (schneller als der Meta-Refresh oben,
        // der nur als Fallback dient, falls JS deaktiviert ist).
        window.location.replace("https://play.google.com/store/apps/details?id=com.tomesschuch.cruising");
    </script>
    <style>
        .redirect-wrap {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 18px;
            padding: 48px 20px;
        }
        .redirect-wrap img { width: 64px; height: 64px; border-radius: 16px; }
        .redirect-wrap p { max-width: 380px; }
    </style>
</head>
<body>

<nav class="topnav">
    <div class="topnav-inner">
        <a href="/index.html" class="brand">
            <img src="/assets/app-icon.png" alt="Cruising Logo">
            <span>CRUISING</span>
        </a>
    </div>
</nav>

<div class="wrap">
    <div class="redirect-wrap">
        <img src="/assets/app-icon.png" alt="Cruising App-Icon">
        <h1>Weiterleitung zu Google Play …</h1>
        <p>Falls sich nichts tut, tippe auf den Button.</p>
        <a class="btn btn-primary" href="https://play.google.com/store/apps/details?id=com.tomesschuch.cruising">Zu Google Play</a>
    </div>
</div>

</body>
</html>
